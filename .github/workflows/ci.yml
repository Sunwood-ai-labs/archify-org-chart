name: Generator and documentation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run setup:archify
      - run: npm test
      - run: npm run build:starter
      - run: npm run build:demos
      - run: npm --prefix docs ci
      - run: npm run docs:build
